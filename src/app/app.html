<div style="padding: 20px; font-family: sans-serif; max-width: 900px; margin: auto;">
  <h2 style="color: #2c3e50;">Gestión de Personas</h2>

  <div style="background: #fdfdfd; padding: 20px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
    <h4 style="margin-top: 0;">
      {{ editando ? '✏️ Editando a: ' + nuevaPersona.nombre : '➕ Agregar Nuevo Usuario' }}
    </h4>
    
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <input type="text" [(ngModel)]="nuevaPersona.nombre" placeholder="Nombre" style="padding: 10px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
      <input type="text" [(ngModel)]="nuevaPersona.apellido" placeholder="Apellido" style="padding: 10px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
      <input type="email" [(ngModel)]="nuevaPersona.email" placeholder="Email" style="padding: 10px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
      
      <button (click)="guardarPersona()" 
              [disabled]="!nuevaPersona.nombre || !nuevaPersona.email"
              [style.opacity]="(!nuevaPersona.nombre || !nuevaPersona.email) ? 0.5 : 1"
              [style.cursor]="(!nuevaPersona.nombre || !nuevaPersona.email) ? 'not-allowed' : 'pointer'"
              [style.background]="editando ? '#f39c12' : '#27ae60'"
              style="color: white; border: none; padding: 10px 25px; border-radius: 4px; font-weight: bold; transition: 0.3s;">
        {{ editando ? 'Actualizar' : 'Guardar' }}
      </button>

      <button *ngIf="editando" (click)="finalizarAccion('Edición cancelada')" 
              style="background: #95a5a6; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">
        Cancelar
      </button>
    </div>
  </div>

  <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

  <div style="position: relative; margin-bottom: 20px;">
    <input type="text" 
           (input)="buscar($event)" 
           placeholder="🔍 Buscar por nombre o apellido..." 
           style="padding: 12px; width: 100%; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box;">
  </div>

  <table style="width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <thead style="background-color: #f8f9fa; border-bottom: 2px solid #dee2e6;">
      <tr>
        <th style="padding: 15px; text-align: left;">ID</th>
        <th style="padding: 15px; text-align: left;">Nombre</th>
        <th style="padding: 15px; text-align: left;">Apellido</th>
        <th style="padding: 15px; text-align: left;">Email</th>
        <th style="padding: 15px; text-align: center;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of personasFiltradas.slice(0, 10)" style="border-bottom: 1px solid #eee;">
        <td style="padding: 12px;">{{ p.id }}</td>
        <td style="padding: 12px;">{{ p.nombre }}</td>
        <td style="padding: 12px;">{{ p.apellido }}</td>
        <td style="padding: 12px;">{{ p.email }}</td>
        <td style="padding: 12px; text-align: center;">
          <button (click)="editar(p)" 
                  style="background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px;">
            ✏️
          </button>
          <button (click)="eliminar(p.id)" 
                  style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
            🗑️
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="personasFiltradas.length === 0" style="text-align: center; padding: 40px; color: #95a5a6;">
    <p>No se encontraron registros en la base de datos.</p>
  </div>
</div>
