<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h1>Gestión de Personas</h1>
  <p>Datos recuperados desde Spring Boot + Docker:</p>

  <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
    <thead style="background-color: #f2f2f2; text-align: left;">
      <tr>
        <th style="padding: 10px;">ID</th>
        <th style="padding: 10px;">Nombre</th>
        <th style="padding: 10px;">Apellido</th>
        <th style="padding: 10px;">Email</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of listaPersonas">
        <td style="padding: 10px;">{{ p.id }}</td>
        <td style="padding: 10px;">{{ p.nombre }}</td>
        <td style="padding: 10px;">{{ p.apellido }}</td>
        <td style="padding: 10px;">{{ p.email }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="listaPersonas.length === 0" style="color: red; margin-top: 10px;">
    No se encontraron personas o el Backend está apagado.
  </p>
</div>
