<div class="login-wrapper">
  <mat-card class="login-card mat-elevation-z8">
    <mat-card-header>
      <div class="login-mark">GI</div>
      <mat-card-title>Gestion Inmobiliaria</mat-card-title>
      <mat-card-subtitle>Acceso al panel operativo</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="mt-3">
      <div *ngIf="pasoActual === 1" class="step-container">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput type="text" [(ngModel)]="username" placeholder="Escribe tu usuario">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <button mat-raised-button class="primary-login full-width mt-2" (click)="irAPassword()">
          Siguiente
        </button>
      </div>

      <div *ngIf="pasoActual === 2" class="step-container">
        <p class="welcome-text">Hola, <b>{{username}}</b></p>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contrasena</mat-label>
          <input matInput type="password" [(ngModel)]="password" placeholder="Tu clave">
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        <div class="d-flex gap-2">
          <button mat-button (click)="pasoActual = 1">Atras</button>
          <button mat-raised-button class="primary-login flex-grow-1" (click)="ejecutarLogin()">
            Ingresar
          </button>
        </div>
      </div>

      <mat-error *ngIf="mensajeError" class="mt-3 text-center">
        {{mensajeError}}
      </mat-error>
    </mat-card-content>
  </mat-card>
</div>
