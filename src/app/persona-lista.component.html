<div class="container mt-4">
  <h2>Lista de Personas</h2>

  <!-- Buscador -->
  <input type="text" (input)="buscar($event)" placeholder="Buscar..." class="form-control mb-3">

  <!-- Tabla -->
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of personasFiltradas">
        <td>{{ p.nombre }}</td>
        <td>{{ p.apellido }}</td>
        <td>{{ p.email }}</td>
        <td>
          <button (click)="editar(p)" class="btn btn-sm btn-primary">Editar</button>
          <button (click)="eliminar(p.id)" class="btn btn-sm btn-danger">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Formulario de creación/edición -->
  <div class="mt-4">
    <h3 *ngIf="!editando">Nueva Persona</h3>
    <h3 *ngIf="editando">Editar Persona</h3>

    <form (ngSubmit)="guardarPersona()">
      <div class="form-group mb-2">
        <input type="text" [(ngModel)]="nuevaPersona.nombre" name="nombre" placeholder="Nombre" class="form-control">
      </div>
      <div class="form-group mb-2">
        <input type="text" [(ngModel)]="nuevaPersona.apellido" name="apellido" placeholder="Apellido" class="form-control">
      </div>
      <div class="form-group mb-2">
        <input type="email" [(ngModel)]="nuevaPersona.email" name="email" placeholder="Email" class="form-control">
      </div>
      <button type="submit" class="btn btn-success">
        {{ editando ? 'Actualizar' : 'Guardar' }}
      </button>
    </form>
  </div>
</div>
